        name:
          type: string
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        params:
          $ref: '#/components/schemas/VlessRealityParams'
    UpdateEndpointRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        params:
          $ref: '#/components/schemas/VlessRealityParams'
