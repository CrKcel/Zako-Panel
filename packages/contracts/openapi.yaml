          type: [string, 'null']
        server_time:
          type: integer
        heartbeat_interval_seconds:
          type: integer
        traffic_interval_seconds:
          type: integer
        users_ver:
          type: integer
        desired_config_version:
          type: integer
        unknown_users:
          type: integer
        directives:
          type: array
          items:
            $ref: '#/components/schemas/AgentDirective'
    AgentUser:
