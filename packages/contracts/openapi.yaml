          created_by,
          expires_at,
          used_at,
          used_node_id,
          revoked_at,
          status,
          created_at,
        ]
      properties:
        id:
          type: string
        name_prefix:
          type: [string, 'null']
        default_sni:
          type: string
        default_port:
