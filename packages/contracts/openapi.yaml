          type: string
        period_start:
          type: integer
        period_end:
          type: integer
        has_counter_gap:
          type: boolean
        node:
          $ref: '#/components/schemas/AgentTrafficNode'
        users:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/AgentTrafficUser'
    AgentReport:
